<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" /><meta name="theme-color" content="#eaf5fb" /><title>Piano Controller</title></head>
<body class="controller-page">
  <main class="controller">
    <header><h1>Piano Controller</h1><p id="connection">Connecting…</p></header>
    <p class="controller-help">If the Host is silent, tap “Press to start” on the Host screen.</p>
    <form id="join-form"><label>Room code <input id="room-input" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" /></label><button class="pill primary" type="submit">Join</button></form>
    <div class="controller-latency" id="latency">Latency —</div>
    <section class="remote-piano" aria-label="Remote piano keys">
      <div class="white-keys">
        <button class="remote-key white-key" data-note="60">C4</button><button class="remote-key white-key" data-note="62">D4</button><button class="remote-key white-key" data-note="64">E4</button><button class="remote-key white-key" data-note="65">F4</button>
        <button class="remote-key white-key" data-note="67">G4</button><button class="remote-key white-key" data-note="69">A4</button><button class="remote-key white-key" data-note="71">B4</button><button class="remote-key white-key" data-note="72">C5</button>
      </div>
      <button class="remote-key black-key" data-note="61" style="left:8.9%" aria-label="C sharp 4"></button>
      <button class="remote-key black-key" data-note="63" style="left:21.4%" aria-label="D sharp 4"></button>
      <button class="remote-key black-key" data-note="66" style="left:46.4%" aria-label="F sharp 4"></button>
      <button class="remote-key black-key" data-note="68" style="left:58.9%" aria-label="G sharp 4"></button>
      <button class="remote-key black-key" data-note="70" style="left:71.4%" aria-label="A sharp 4"></button>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
